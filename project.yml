name: YourTube
options:
  bundleIdPrefix: net.claytons
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  YouTubePlayerKit:
    url: https://github.com/SvenTiigi/YouTubePlayerKit
    from: 2.0.0

settings:
  base:
    SWIFT_VERSION: "5.10"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "J52S5R2K5A"

targets:
  YourTube:
    type: application
    platform: iOS
    sources:
      - path: YourTube
    dependencies:
      - package: YouTubePlayerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.claytons.yourtube
        INFOPLIST_FILE: YourTube/Resources/Info.plist
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        TARGETED_DEVICE_FAMILY: "1"

  YourTubeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YourTubeTests
    dependencies:
      - target: YourTube
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.claytons.yourtube.tests
